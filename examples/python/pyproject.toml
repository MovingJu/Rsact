[project]
name = "rsact-examples"
version = "0.1.0"
description = "Example scripts against the rsact Python bindings"
requires-python = ">=3.9"
dependencies = ["rsact"]

# `rsact` above is a normal dependency specifier, same as any project that
# consumes the package would write. This override only applies when uv
# runs *from inside this repo* — it resolves that dependency to the local,
# editable crates/rsact-py instead of fetching it, purely so `uv run` here
# iterates fast without a network round-trip. An external consumer's own
# pyproject.toml has no such override.
[tool.uv.sources]
rsact = { path = "../../crates/rsact-py", editable = true }
