[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rsact"
version = "0.2.0"
description = "PyO3 bindings for rsact-core"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
module-name = "rsact"
features = ["pyo3/extension-module"]
# rsact.pyi is generated by `cargo run --bin stub_gen` (see README.md);
# py.typed marks the package as carrying its own type information (PEP
# 561) so type checkers trust the stub instead of treating rsact as
# untyped.
include = ["rsact.pyi", "py.typed"]
