name: Bug report
description: Report something that isn't working as expected
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please keep the issue
        title in [Conventional Commits](../../CONTRIBUTING.md) style
        (`fix: short summary`) — it becomes the branch/commit summary once
        this is picked up.

  - type: dropdown
    id: scope
    attributes:
      label: Affected crate / scope
      options:
        - rsact-core
        - rsact-ffi
        - rsact-demo
        - examples
        - build
        - ci
        - other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally with a code snippet.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust toolchain version (`rustc --version`), rsact version/commit.
      placeholder: |
        - OS:
        - rustc:
        - rsact version/commit:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
    validations:
      required: false
